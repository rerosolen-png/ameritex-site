name: Produção (HostGator)

# Publica o site em ameritex.com.br (hospedagem HostGator) por FTPS.
#
# Configuração, feita uma única vez em Settings > Secrets and variables > Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR  (pasta do site vista pela conta FTP; termina com "/")
#              HOSTGATOR_DEPLOY = true  (liga o deploy automático)
#
# Enquanto HOSTGATOR_DEPLOY não for "true", o job é ignorado.
# Passo a passo completo em docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulação: lista o que seria enviado, sem alterar o servidor"
        type: boolean
        default: false

permissions:
  contents: read

# Um deploy por vez; nunca cancela um envio em andamento
concurrency:
  group: hostgator
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e envio por FTPS
    if: vars.HOSTGATOR_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: producao
      url: https://ameritex.com.br
    steps:
      - name: Conferir configuração
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR deve terminar com / (ex.: public_html/ ou ./)"; missing=1 ;;
          esac
          exit $missing

      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Sem SITE_URL: o build usa a URL de produção definida em src/data/site.json
      - name: Build do site
        run: node scripts/build.mjs

      - name: Validação (HTML, SEO, links, imagens, .htaccess)
        run: node scripts/check.mjs

      # Envia apenas os arquivos novos ou alterados e remove do servidor somente
      # arquivos que ele mesmo enviou antes (nunca apaga arquivos de terceiros).
      - name: Enviar para a HostGator (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: ${{ vars.FTP_SECURITY || 'loose' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            .build-meta.json
            CNAME
            _redirects

      - name: Teste pós-deploy
        if: ${{ !inputs.dry_run }}
        run: |
          url=$(node -p "require('./dist/.build-meta.json').siteUrl")
          css=$(ls dist/assets/css/ | head -1)
          fail=0
          check() { # check <descrição> <esperado> <obtido>
            if [ "$2" = "$3" ]; then echo "ok   $1 ($3)"; else echo "::error::$1: esperado $2, obtido $3"; fail=1; fi
          }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1"; }
          check "página inicial"            200 "$(code "$url/")"
          check "CSS desta versão no ar"    200 "$(code "$url/assets/css/$css")"
          check "página de produto"         200 "$(code "$url/produtos/passadeiras-de-pvc/")"
          check "sitemap"                   200 "$(code "$url/sitemap.xml")"
          check "redirecionamento antigo"   301 "$(code "$url/sobre-nos/")"
          check "página inexistente"        404 "$(code "$url/pagina-que-nao-existe-$RANDOM/")"
          check "arquivo oculto bloqueado"  403 "$(code "$url/.htaccess")"
          exit $fail
