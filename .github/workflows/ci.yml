name: CI

# Roda em todo pull request para main (o push em main é coberto pelo workflow de deploy).
# Não roda em push de branch para evitar execução em dobro (push + pull_request) no mesmo commit.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build e validação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build do site
        run: node scripts/build.mjs

      - name: Validação (HTML, SEO, links, imagens)
        run: node scripts/check.mjs

      - name: Publicar artefato de preview
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7
